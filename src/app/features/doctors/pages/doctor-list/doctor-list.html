<mat-card class="doctors-card">

  <div class="header">
    <h1>Doctors</h1>

    <button mat-raised-button color="primary" routerLink="/doctors/new">
      <mat-icon>add</mat-icon>
          Add Doctor
    </button>

  </div>

  <mat-form-field appearance="outline" class="search">
    <mat-label>Search doctors</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Name, specialty, department">
  </mat-form-field>

  <div *ngIf="dataSource.data.length">

    <table mat-table [dataSource]="dataSource" matSort>

      <ng-container matColumnDef="id">
        <th  mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
          <td mat-cell *matCellDef="let doctor">{{doctor.id}}</td>
      </ng-container>


      <ng-container matColumnDef="name">
        <th  mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td  mat-cell *matCellDef="let doctor">
          Dr. {{doctor.firstName}}
          {{doctor.lastName}}
        </td>
      </ng-container>

      <ng-container matColumnDef="specialty">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Specialty</th>
        <td  mat-cell *matCellDef="let doctor">{{doctor.specialty}}</td>
      </ng-container>


      <ng-container matColumnDef="department">
        <th  mat-header-cell *matHeaderCellDef mat-sort-header>Department</th>
        <td mat-cell *matCellDef="let doctor">{{doctor.department}}</td>
      </ng-container>


      <ng-container matColumnDef="availability">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Availability</th>
        <td mat-cell *matCellDef="let doctor"><mat-chip>{{doctor.availability}}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th  mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let doctor"><mat-chip>{{doctor.status}}</mat-chip></td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th  mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let doctor">

          <button mat-icon-button [routerLink]="['/doctors', doctor.id]">
            <mat-icon> visibility</mat-icon>
          </button>

          <button mat-icon-button [routerLink]="['/doctors', doctor.id, 'edit']">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="deleteDoctor(doctor.id)">
            <mat-icon>delete</mat-icon>
          </button>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>


    <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons></mat-paginator>

</div>


  <div class="empty-state" *ngIf="!dataSource.data.length">
    <h2>No doctors found</h2>
    <p>Add a doctor to get started.</p>

    <button mat-raised-button color="primary" routerLink="/doctors/new">
      <mat-icon>add</mat-icon>
          Add Doctor
    </button>

  </div>

</mat-card>
