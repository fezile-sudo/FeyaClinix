<mat-card class="form-card">
 <h1>{ isEditMode ? 'Edit Patient' : 'Add New Patient' }}</h1> 

  <form [formGroup]="patientForm" (ngSubmit)="savePatient()">
    <h2>Personal Information</h2>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>First Name</mat-label>
        <input matInput formControlName="firstName">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="lastName">
      </mat-form-field>

    </div>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Gender</mat-label>
        <mat-select formControlName="gender">
          <mat-option value="Male">Male</mat-option>

          <mat-option value="Female">Female</mat-option>

          <mat-option value="Other"> Other</mat-option>

        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Blood Group</mat-label>

        <mat-select formControlName="bloodGroup">
          <mat-option value="A+">A+</mat-option>
          <mat-option value="A-">A-</mat-option>
          <mat-option value="B+">B+</mat-option>
          <mat-option value="B-">B-</mat-option>
          <mat-option value="O+">O+</mat-option>
          <mat-option value="O-">O-</mat-option>
          <mat-option value="AB+">AB+</mat-option>
        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Date of Birth</mat-label>
          <input matInput type="date" formControlName="dateOfBirth">

      </mat-form-field>
    </div>

    <h2>Contact Information</h2>
    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email"></mat-form-field>

    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Address</mat-label>
      <textarea matInput formControlName="address"></textarea>
    </mat-form-field>

    <h2>Medical Information</h2>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Allergies</mat-label>
      <textarea matInput formControlName="allergies"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Medical Conditions</mat-label>
      <textarea matInput formControlName="medicalConditions"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Insurance Provider</mat-label>
      <input matInput formControlName="insuranceProvider">
    </mat-form-field>

    <div class="actions">

      <button mat-button type="button">Cancel</button>

      <button mat-raised-button color="primary" type="submit">
        Save Patient
      </button>
    </div>
  </form>
</mat-card>
