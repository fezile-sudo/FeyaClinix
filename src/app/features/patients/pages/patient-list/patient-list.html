<mat-card class="patients-card">
  <div class="header">
    <h1>Patients</h1>

    <button  mat-raised-button color="primary" routerLink="/patients/new">
      <mat-icon>add</mat-icon>
          Add Patient
    </button>

  </div>

        <mat-form-field appearance="outline" class="search">
        <mat-label>Search patients</mat-label>
          <input matInput (keyup)="applyFilter($event)" placeholder="Name, phone, blood group">
        </mat-form-field>

      <div *ngIf="hasPatients">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let patient">{{patient.id}}</td>
         </ng-container>


        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
            <td mat-cell *matCellDef="let patient"> {{patient.firstName}} {{patient.lastName}}</td>
        </ng-container>

        <ng-container matColumnDef="gender">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Gender</th>
            <td mat-cell *matCellDef="let patient"> {{patient.gender}}</td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Phone</th>
          <td mat-cell *matCellDef="let patient">{{patient.phone}}</td>
        </ng-container>

        <ng-container matColumnDef="bloodGroup">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Blood</th>
        <td mat-cell *matCellDef="let patient">{{patient.bloodGroup}}</td>
      </ng-container>

      <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let patient"><mat-chip>{{patient.status}}</mat-chip></td>
      </ng-container>

      <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions</th>
      <td mat-cell *matCellDef="let patient">

        <button mat-icon-button [routerLink]="['/patients', patient.id]">
        <mat-icon>visibility</mat-icon>
        </button>

        <button mat-icon-button [routerLink]="['/patients', patient.id, 'edit']">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="deletePatient(patient.id)">
          <mat-icon> delete</mat-icon>
        </button>

    </td>
</ng-container>

        <tr mat-header-row  *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>

<mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons></mat-paginator>

</div>

<div class="empty-state" *ngIf="!hasPatients">
  <h2> No patients found</h2>
  <p>Add a patient to get started.</p>

  <button mat-raised-button color="primary" routerLink="/patients/new">
    <mat-icon>add</mat-icon>
    Add Patient
  </button>

</div>
</mat-card>
