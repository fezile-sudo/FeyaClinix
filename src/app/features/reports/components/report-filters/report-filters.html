<div class="filters">


      <mat-form-field appearance="outline">

      <mat-label>Status</mat-label>

      <mat-select [(ngModel)]="selectedStatus">

      @for(status of statuses; track status){

      <mat-option [value]="status">
        {{status}}
      </mat-option>

      }

      </mat-select>
      </mat-form-field>



          <mat-form-field appearance="outline">

            <mat-label>From Date</mat-label>

            <input matInput [matDatepicker]="fromPicker" [(ngModel)]="fromDate">

            <mat-datepicker-toggle matSuffix [for]="fromPicker"></mat-datepicker-toggle>

            <mat-datepicker #fromPicker></mat-datepicker>

          </mat-form-field>



        <mat-form-field appearance="outline">

          <mat-label>To Date</mat-label>

          <input matInput [matDatepicker]="toPicker" [(ngModel)]="toDate">

          <mat-datepicker-toggle matSuffix [for]="toPicker"></mat-datepicker-toggle>

          <mat-datepicker #toPicker></mat-datepicker>

        </mat-form-field>



      <mat-form-field appearance="outline">
      <mat-label>Doctor</mat-label>
          <mat-select [(ngModel)]="selectedDoctor">

         @for(doctor of doctors; track doctor.id){

              <mat-option [value]="doctor.name">
                    {{doctor.name}}
              </mat-option>
      }

          </mat-select>
      </mat-form-field>

        <button mat-raised-button color="primary" (click)="generateReport()">
            Generate Report
        </button>


</div>
